# Combine files and upload it as zip to the release
# Original file from https://github.com/hacs/integration/blob/main/.github/workflows/release.yml

name: Release

on:
  release:
    types: [published]

# Uploading a release asset needs write access; the default GITHUB_TOKEN is read-only.
permissions:
  contents: write

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set version number
        run: python3 .github/helpers/update_manifest.py --version "$TAG_NAME"

      - name: Combine ZIP
        working-directory: custom_components/frank_energie
        run: zip -r frank_energie.zip ./

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" custom_components/frank_energie/frank_energie.zip --clobber
